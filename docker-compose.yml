services:
  xactions-api:
    container_name: x-crawler-app
    restart: unless-stopped
    stop_grace_period: 30s
    image: localhost/x-crawler:latest
    env_file: ./.env
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}"
    environment:
      TZ: UTC
      XACTIONS_AUTH_TOKEN: ${XACTIONS_AUTH_TOKEN}
      XACTIONS_SESSION_COOKIE: ${XACTIONS_AUTH_TOKEN}
    networks:
      - crawlers-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - xactions_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://${HOST}:${PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  xactions_data:

networks:
  crawlers-network:
    external: true
